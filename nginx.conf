server {
    listen 80;
    server_name localhost;

    # Gzip compression for high-performance loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy for ERPNext / Frappe REST APIs
    # Forwards requests to the backend server on port 8280
    location /api/ {
        proxy_pass http://45.195.159.86:8280/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host 45.195.159.86:8280;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cookie_path / /;
    }

    # Prevent directory index 403 on client routes like /assets
    location = /assets {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location = /assets/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Frontend Single Page Application (SPA) routing fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
