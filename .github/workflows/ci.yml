name: ETHX HRMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Minimum necessary permissions (Least Privilege)
permissions:
  contents: read

# Cancel redundant superseded pipeline runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Analysis, Dependency Audit & TypeScript Type Checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Static Type Verification
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Job 2: Role-Based Access Control (RBAC) & Business Logic Test Suite
  # ---------------------------------------------------------------------------
  rbac-tests:
    name: RBAC & Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute RBAC Security & Business Logic Verification
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 3: Production Web Application Build Verification
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Web Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rbac-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle (Vite)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 4: Docker Container Image Build (Zero-Deploy Verification)
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build Docker Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run - No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ethx-hrms:ci-test
